<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Nöbet Listesi — radyoloji nöbet planlama">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#eef4f3" />
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12857a" />
      <stop offset="1" stop-color="#0b5a53" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect x="0" y="0" width="12" height="630" fill="#0f6f66" />

  <!-- Sol taraf: kimlik -->
  <rect x="72" y="74" width="86" height="86" rx="21" fill="url(#badge)" />
  <text x="115" y="134" font-family="DejaVu Sans" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>

  <rect x="72" y="232" width="76" height="6" rx="3" fill="#0f6f66" />
  <text x="72" y="312" font-family="DejaVu Sans" font-size="70" font-weight="bold" fill="#101828">Nöbet Listesi</text>
  <text x="72" y="360" font-family="DejaVu Sans" font-size="29" font-weight="bold" fill="#0f6f66">Radyoloji nöbet planlama</text>

  <text x="72" y="420" font-family="DejaVu Sans" font-size="22" fill="#5a6675">Kadro, izin ve dinlenme kuralları otomatik uygulanır;</text>
  <text x="72" y="452" font-family="DejaVu Sans" font-size="22" fill="#5a6675">çizelge tek tuşla Google E-Tablo'ya aktarılır.</text>

  <rect x="72" y="498" width="452" height="46" rx="23" fill="#ffffff" stroke="#e2e7ee" />
  <circle cx="100" cy="521" r="6" fill="#0f6f66" />
